name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/aws_creds.json
          AWS_ACCESS_KEY_ID=$(python -c "import json; print(json.load(open('/tmp/aws_creds.json'))['aws_access_key_id'])")
          AWS_SECRET_ACCESS_KEY=$(python -c "import json; print(json.load(open('/tmp/aws_creds.json'))['aws_secret_access_key'])")
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV

      - name: Pull data with DVC
        # TODO 3: Pull cac file du lieu can thiet tu cloud storage bang lenh dvc pull.
        # Neu S3 bucket chua co du lieu (do ban chua the chay dvc push o local),
        # pipeline se tu dong tao va upload du lieu len giup ban.
        run: |
          dvc remote modify myremote url s3://${{ secrets.CLOUD_BUCKET }}/dvc
          dvc pull data/train_phase1.csv data/eval.csv || (
            echo "S3 bucket is empty. Generating and seeding data..."
            python generate_data.py
            dvc add data/eval.csv data/train_phase2.csv
            python add_new_data.py
            dvc add data/train_phase1.csv
            dvc push
          )

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        # TODO 4: Doc gia tri "accuracy" tu outputs/metrics.json bang Python inline.
        #         Set ket qua thanh output "accuracy" de job deploy co the doc.
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        # TODO 5: Su dung cloud SDK de upload models/model.pkl len
        #         <bucket>/models/latest/model.pkl.
        #         Ten bucket lay tu secret CLOUD_BUCKET.
        run: |
          python - <<'EOF'
          import boto3
          import os
          bucket_name = '${{ secrets.CLOUD_BUCKET }}'
          s3 = boto3.client('s3')
          s3.upload_file('models/model.pkl', bucket_name, 'models/latest/model.pkl')
          print('Model uploaded to AWS S3.')
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        # TODO 6: Doc accuracy tu output cua job train.
        #         Neu accuracy < 0.70, ket thuc voi loi ro rang.
        #         Neu dat nguong, in thong bao va tiep tuc.
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          if acc < 0.70:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.70. Huy deploy.")
          print(f"PASSED: dang trien khai model voi accuracy {acc:.4f}.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: SCP serve.py to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "src/serve.py"
          target: "/home/${{ secrets.VM_USER }}"

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          CLOUD_CREDENTIALS_JSON: ${{ secrets.CLOUD_CREDENTIALS }}
          BUCKET: ${{ secrets.CLOUD_BUCKET }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: CLOUD_CREDENTIALS_JSON,BUCKET
          script: |
            sudo apt-get update
            sudo apt-get install -y python3-venv jq
            mkdir -p ~/models ~/src
            python3 -m venv ~/.venv
            ~/.venv/bin/pip install fastapi uvicorn scikit-learn joblib boto3

            export AWS_ACCESS_KEY_ID=$(echo $CLOUD_CREDENTIALS_JSON | jq -r .aws_access_key_id)
            export AWS_SECRET_ACCESS_KEY=$(echo $CLOUD_CREDENTIALS_JSON | jq -r .aws_secret_access_key)

            sudo tee /etc/systemd/system/mlops-serve.service > /dev/null <<EOF
            [Unit]
            Description=MLOps Model Inference Server
            After=network.target

            [Service]
            User=${USER}
            WorkingDirectory=/home/${USER}
            Environment="GCS_BUCKET=${BUCKET}"
            Environment="AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            Environment="AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            Environment="AWS_DEFAULT_REGION=ap-southeast-1"
            ExecStart=/home/${USER}/.venv/bin/python /home/${USER}/src/serve.py
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable mlops-serve
            sudo systemctl restart mlops-serve
            sleep 5
            curl -sf http://localhost:8000/health && echo "Health check passed." || exit 1
